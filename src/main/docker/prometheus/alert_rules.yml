groups:
  - name: application_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'High 5xx error rate'
          description: '5xx error rate is {{ $value }}/s for the last 5 minutes'

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High P95 latency'
          description: 'P95 latency is {{ $value }}s'

      - alert: JvmHeapPressure
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'JVM heap usage above 85%'

      - alert: HikariPoolExhaustion
        expr: hikaricp_connections_pending > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'HikariCP connection pool exhaustion'

      - alert: ApplicationDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Application instance is down'

      - alert: HighInvalidTokenRate
        expr: rate(security_authentication_invalid_tokens_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High rate of invalid authentication tokens'

      - alert: HighLoginFailureRate
        expr: rate(business_user_login_failure_total[5m]) / (rate(business_user_login_success_total[5m]) + rate(business_user_login_failure_total[5m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Login failure rate above 30%'
